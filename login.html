<!doctype html>
<html lang="hy">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Մուտք — Տեղեկատվական անվտանգության</title>

  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="auth-page">

  <header class="site-header auth-header">
    <div class="container-logo-block">
      <img src="assets/images/logo.png" alt="Logo" class="logo">
    </div>
  </header>

  <main class="auth-wrapper">
    <div class="auth-card">
      <h2>Մուտք համակարգ</h2>
      <p class="auth-subtitle">Մուտք գործեք ձեր հաշիվ</p>

      <form id="loginForm">
        <div class="field">
          <label>Էլ. հասցե</label>
          <input type="email" id="email" placeholder="example@mail.com" required>
        </div>

        <div class="field">
          <label>Գաղտնաբառ</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>

        <button class="btn primary" type="submit">Մուտք</button>

        <div class="auth-footer">
          <span>Դեռ չունե՞ք հաշիվ</span>
          <a href="register.html">Գրանցվել</a>
        </div>
      </form>

      <div id="loginMsg" class="auth-msg"></div>
    </div>
  </main>

  <script src="assets/js/app.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', e=>{
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const pwd = document.getElementById('password').value;
      const users = JSON.parse(localStorage.getItem('users') || '[]');
      const user = users.find(u => u.email === email && u.password === pwd);
      const msg = document.getElementById('loginMsg');

      if (user) {
        localStorage.setItem('currentUser', JSON.stringify({email:user.email, name:user.name}));
        msg.textContent = '✅ Մուտքը հաջողվեց։';
        msg.className = 'auth-msg success';
        setTimeout(()=> location.href = 'course.html', 900);
      } else {
        msg.textContent = '❌ Սխալ էլ. հասցե կամ գաղտնաբառ';
        msg.className = 'auth-msg error';
      }
    });
  </script>

</body>
</html>
