      <h4>Ի՞նչ է տեղեկատվական անվտանգությունը</h4>

      Տեղեկատվական անվտանգությունը տեղեկատվության և նրան սպասարկող ենթակառուցվածքների

      </p>

      <p>

      համակարգչային անվտանգության, ցանցերի անվտանգության, հեռահաղորդակցության անվտանգության և 
      տվյալների պաշտպանության ոլորտները։

      <h4>Տեղեկատվական անվտանգության հիմնական սկզբունքները</h4>

        </li>

        <li>
          <strong>Ամբողջականություն (Integrity)</strong> – Տվյալները պետք է պահպանվեն ճիշտ, չփոփոխված և

        </li>

        <li>

          ունենալ տվյալ համակարգերին։
        </li>
      </ul>

      <h4>Տեղեկատվական անվտանգության ուսումնասիրության հիմնական ուղղությունները</h4>
