  <p><strong>Վիրուսներ և վնասակար ծրագրեր (Malware)</strong> — վնասակար ծրագրերը, ինչպիսիք են

  <li><strong>Օգտագործողի պաշտպանությունը</strong> — Օգտատերերի իրազեկումը և ուսուցումն է անվտանգության ռիսկերի և սպառնալիքների մասին:</li>
</ol>

<p>Տեղեկատվական պաշտպանությունը հատկապես կարևոր է կազմակերպությունների և անհատների համար, քանի որ այն պաշտպանում է անձնական, ֆինանսական, բիզնես և այլ զգայուն տվյալները՝ ապահովելով նրանց գործունեության անխափանությունը և վստահությունը:</p>

<p>Տեղեկատվական պաշտպանությունը ենթադրում է մի շարք միջոցառումներ և տեխնոլոգիաներ, որոնք ուղղված են տվյալների գաղտնիության, ամբողջականության և հասանելիության ապահովմանը: Ահա հիմնական մեթոդները, որոնք կիրառվում են տեղեկատվական անվտանգության համար.</p>

<h2>Գաղտնագրում (Encryption)</h2>

<p>Գաղտնագրումը տվյալների կոդավորման գործընթաց է, որի արդյունքում տվյալները դարձվում են անհասկանալի չարտոնված օգտատերերի համար: Միայն համապատասխան դեկոդավորման բանալիով հնարավոր է դառնում տվյալների ընթերցումը: Գաղտնագրումն ապահովում է տվյալների գաղտնիությունը ինչպես փոխանցման, այնպես էլ պահպանման ընթացքում:</p>

<p>Գաղտնագրումը տվյալների անվտանգության ժամանակակից գործելակերպի հիմնաքարն է և առաջարկում է բազմաթիվ առավելություններ, ներառյալ զգայուն տեղեկատվության պաշտպանությունը և տվյալների պաշտպանության ընդհանուր ռազմավարությունների ամրապնդումը:</p>

<ul>
  <li><strong>Գաղտնիության ապահովում</strong> — Այն կանխում է չարտոնված մուտքը՝ պարզ տեքստը վերածելով անհնթեռնելի գաղտնագրային տեքստի:</li>
  <li><strong>Համապատասխանություն տվյալների կանոնակարգերին</strong> — Գաղտնագրումը օգնում է բավարարել GDPR, PCI DSS և այլ պահանջներ՝ պաշտպանելով PII, ֆինանսական և առողջական տվյալները:</li>
  <li><strong>Տվյալների անվտանգ փոխանցում</strong> — Ապահովում է հաղորդակցման ուղիները՝ կարևոր է գործարքների, առցանց հաղորդակցության և ամպային ծառայությունների համար:</li>
  <li><strong>Տվյալների պաշտպանություն հանգստի ժամանակ</strong> — Պահեստավորված տվյալները մնում են պաշտպանված, նույնիսկ եթե չարտոնված անձը մուտք ստանա սարքերին:</li>
  <li><strong>Սպառնալիքների մեղմացում</strong> — Նվազեցնում է ներքին և արտաքին սպառնալիքները՝ տվյալները դարձնելով անվերծանելի առանց բանալու:</li>
  <li><strong>Տվյալների ամբողջականության պահպանում</strong> — Երաշխավորում է, որ տվյալները չեն փոփոխվի առանց թույլտվության:</li>
  <li><strong>Ճկունություն</strong> — Կիրառելի է տարբեր միջավայրերում՝ արտադրական և ոչ արտադրական:</li>
</ul>

<h2>Մուտքի վերահսկման միջոցներ (Access Control)</h2>

<p>Մուտքի վերահսկման միջոցները սահմանում են, թե ով և ինչ պայմաններում կարող է օգտվել տվյալ համակարգերից և տվյալներից։</p>

<ol>
  <li><strong>Օգտագործողի նույնականացում (Authentication)</strong> — Գաղտնաբառ, մատնահետք, դեմքի ճանաչում, երկփուլ նույնականացում:</li>
  <li><strong>Իրավասությունների սահմանում (Authorization)</strong> — Օգտատերերին տրվում են սահմանափակված իրավունքներ տվյալների ու գործողությունների համար:</li>
  <li><strong>DAC — Դիսկրետ վերահսկում</strong> — Սեփականատերը որոշում է տվյալների հասանելիությունը:</li>
  <li><strong>MAC — Պարտադիր վերահսկում</strong> — Կենտրոնացված քաղաքականություններ՝ հիմնված գաղտնիության մակարդակի վրա:</li>
  <li><strong>RBAC — Դերերի վրա հիմնված վերահսկում</strong> — Մուտքի իրավունքները տրվում են ըստ դերի:</li>
  <li><strong>2FA / MFA</strong> — Բազմաֆակտոր նույնականացում՝ բարձր անվտանգության համար:</li>
  <li><strong>Logging & Monitoring</strong> — Բոլոր գործողությունների գրանցում և ստուգում:</li>
</ol>

<h3>Մուտքի վերահսկման գործնական օրինակներ</h3>

<p>Կառավարական կամ ֆինանսական հաստատություններում կիրառվում է MAC, իսկ IT ընկերություններում — RBAC:</p>

<p>Կենսաչափական մուտքի օրինակ — մատնահետքի կամ դեմքի ճանաչում:</p>

<h3>Կարևորությունը</h3>

<p>Մուտքի վերահսկումը պաշտպանում է տվյալները չարտոնված մուտքից, նվազեցնում է խոցելիությունները և պաշտպանում է զգայուն տեղեկատվությունը:</p>

<h2>Ֆայերվոլներ (Firewalls)</h2>

<p>Ֆայերվոլները վերահսկում են ցանցի մուտքն ու ելքը՝ կանխելով չարտոնված մուտքը կամ վնասակար գործունեությունը։ Դրանք գործում են որպես պաշտպանական պատ:</p>

<h2>Տվյալների պահուստավորում (Data Backup)</h2>

<p>Պարբերական պահուստավորումը օգնում է վերականգնել տվյալները վնասվելու կամ կորստի դեպքում։ Կարևոր է պահել տվյալները թե՛ տեղական, թե՛ ամպային միջավայրում։</p>

<h2>Կենսաչափական միջոցառումներ (Biometric Security)</h2>

<p>Նույնականացում՝ մատնահետք, աչքի ցանցաթաղանթ, ձայն, դեմքի ճանաչում — ապահովում են բարձր պաշտպանություն։</p>

<h2>Հաշվետվություն և մոնիտորինգ (Logging and Monitoring)</h2>

<p>Մշտադիտարկումն ու գործողությունների գրանցումը օգնում են հայտնաբերել չարտոնված գործողությունները և կանխել խոցելիությունները։</p>

<h2>Ծրագրերի թարմացում (Software Updates and Patch Management)</h2>

<p>Օպերացիոն համակարգերի և ծրագրերի թարմացումները վերացնում են խոցելիությունները և պաշտպանում են համակարգը հարձակումներից։</p>

<h2>Կրթություն և իրազեկում (Training and Awareness)</h2>

<p>Աշխատակիցների ու օգտատերերի ուսուցումը օգնում է ճանաչել սպառնալիքները, օրինակ՝ ֆիշինգը, և պաշտպանել տվյալները։</p>

<h3>1. Կոդավորման մեթոդներ</h3>
<p><strong>Ասիմետրիկ գաղտնագրում (RSA, ECC)</strong> — օգտագործվում է տվյալների փոխանցման ժամանակ։  
Այն ունի երկու բանալի՝ հանրային և մասնավոր։ Հանրայինը կարելի է հրապարակել, իսկ մասնավորը պահվում է անվտանգ միջավայրում։ Այն ապահով է, սակայն դանդաղ է մեծ ծավալի տվյալների համար։</p>

<p><strong>Սիմետրիկ գաղտնագրում (AES, ChaCha20)</strong> — օգտագործվում է տվյալների արագ կոդավորման համար։  
Այն օգտագործում է մեկ ընդհանուր բանալի, որը կիրառվում է և՛ կոդավորման, և՛ վերծանման համար։ Առավել հարմար է մեծ ծավալի տվյալների պաշտպանության համար։</p>

<h3>2. Մեքենայական ուսուցում և արհեստական բանականություն (AI)</h3>
<p>AI և ML ալգորիթմները կարող են կանխատեսել և հայտնաբերել կիբեռհարձակումները՝ վերլուծելով մեծաքանակ ցանցային տվյալներ։ Դրանք օգտագործվում են հետևյալ ոլորտներում․</p>
<ul>
  <li>Սպամի ֆիլտրացում</li>
  <li>Վնասաբեր ծրագրերի հայտնաբերում</li>
  <li>Խարդախությունների կանխարգելում</li>
  <li>Ավտոմատ ռիսկերի գնահատում</li>
</ul>
<p><strong>AI</strong>–ն ընդհանրապես ներառում է համակարգչային տեսողություն, NLP, ինքնավար համակարգեր և այլն։  
<strong>ML</strong>–ը AI-ի ենթաբազմություն է, որն ուսումնասիրում է տվյալները և ինքնուրույն սովորում՝ առանց մարդու միջամտության։</p>

<h3>3. Երկֆակտոր (2FA) և բազմագործոն նույնականացում (MFA)</h3>
<p>Օգտագործվում է՝</p>
<ul>
  <li>Հաշիվների պաշտպանությունն ուժեղացնելու համար</li>
  <li>Գաղտնաբառից բացի լրացուցիչ գործոններ կիրառելու համար՝ SMS, բիոմետրիկա, հավելվածի կոդ</li>
</ul>

<h3>4. Բլոկչեյն տեխնոլոգիա</h3>
<p>Տվյալները պահվում են բաշխված և անփոփոխ ձևով։ Բլոկչեյնը օգնում է ապահովել՝</p>
<ul>
  <li>Վստահելիություն</li>
  <li>Անփոփոխություն</li>
  <li>Դիտարկելիություն</li>
</ul>
<p>Օգտագործվում է ֆինանսական համակարգերում, կրիպտոտեխնոլոգիաներում, լոգիստիկայում և ազգային ռեգիստրերում։</p>

<h3>5. IDS/IPS անվտանգության համակարգեր</h3>
<p><strong>IDS</strong> — վերլուծում է ցանցային տվյալները և հայտնաբերում կասկածելի ակտիվությունը։</p>
<p><strong>IPS</strong> — ոչ միայն հայտնաբերում է հարձակումը, այլ նաև կանխում է այն՝ ավտոմատ կերպով արգելափակելով վնասաբեր գործողությունները։</p>

<h3>6. Zero Trust մոդել</h3>
<p>Zero Trust–ը ենթադրում է․</p>
<ul>
  <li>Ոչ ոք չի վստահվում կանխավ</li>
  <li>Յուրաքանչյուր մուտք պետք է ստուգվի</li>
  <li>Յուրաքանչյուր սարք, օգտատեր և ծառայություն ենթակա է վավերացման</li>
</ul>

<h3>7. Անվտանգության թեստավորում (Penetration Testing)</h3>
<p>Մասնագետները կատարում են հարձակման նմանակում՝ բացահայտելու համակարգի թույլ জায়গերը։  
Օգտագործվում է՝</p>
<ul>
  <li>Վեբ կայքերի թեստավորման համար</li>
  <li>Ցանցերի պաշտպանությունը ստուգելու համար</li>
  <li>Հավելվածների անվտանգության գնահատման համար</li>
</ul>

      const modulesList = document.getElementById('modulesList');
      const mTitle = document.getElementById('mTitle');
      const mDesc = document.getElementById('mDesc');
      const mVideo = document.getElementById('mVideo');

      modules.forEach(m => {
        const li = document.createElement('li');
        li.className = 'module-item';
        li.innerHTML = `<button class="linkish" data-id="${m.id}">${m.title}</button>`;
        modulesList.appendChild(li);
      });

      modulesList.addEventListener('click', e => {
  if (e.target.matches('button.linkish')) {
    // highlight active module в sidebar
    document.querySelectorAll('.linkish').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');

    const id = +e.target.dataset.id;
    const mod = modules.find(x => x.id === id);
    
    const cardActions = `
    <div>
      ${mod.tests.map(t => 
        `<a href="quiz.html?module=${mod.id}&test=${t.id}" class="btn">${t.title}</a>`
      ).join('')}
      </div>
    `;

    const cardActionsPractice = `
    <div class="practices-buttons-block">
      ${mod.practices.map(t => 
        `<a href="practice.html?module=${mod.id}&practice=${t.id}" class="btn">${t.title}</a>`
      ).join('')}
      </div>
    `;
    const card = document.getElementById('contentCard');

    if (mod.sections && Array.isArray(mod.sections)) {
      const buttonsHtml = mod.sections.map((s, idx) => {
        return `<button class="section-btn" data-section="${s.id}">${s.title}</button>`;
      }).join('');

      card.innerHTML = `
        <h3>${mod.title}</h3>
        <p class="muted">${mod.desc}</p>

        ${ mod.poster || mod.video ? `
          <div class="media">
            ${ mod.video && mod.video.includes('youtube') 
               ? `<iframe class="video-embed" src="${mod.video}" frameborder="0" allowfullscreen style="width:100%;height:420px;border-radius:12px;"></iframe>`
               : `<video controls poster="${mod.poster || ''}" style="width:100%;border-radius:8px;"><source src="${mod.video}" type="video/mp4">Ձեր դիտարկիչը չի աջակցում mp4 ձևաչափը։</video>`
            }
          </div>` : '' }

        <div class="sections-control" style="margin:18px 0;">${buttonsHtml}</div>

        <div id="sectionContent" class="module-text"></div>

        <div class="card-actions" style="margin-top:18px;">
          ${cardActionsPractice}
          ${cardActions}
        </div>
      `;

      const showSection = (sectionId) => {
        const section = mod.sections.find(s => s.id === sectionId) || mod.sections[0];
        document.getElementById('sectionContent').innerHTML = section.content;

        document.querySelectorAll('.section-btn').forEach(b => {
          b.classList.toggle('active', b.dataset.section === section.id);
        });
      };

      // навесим обработчик на кнопки
      const control = card.querySelector('.sections-control');
      control.addEventListener('click', (ev) => {
        if (ev.target.matches('.section-btn')) {
          showSection(ev.target.dataset.section);
        }
      });

      // показать первую секцию по умолчанию
      showSection(mod.sections[0].id);

    } else {
      // если нет sections — старый рендер (один content)
      card.innerHTML = `
        <h3>${mod.title}</h3>
        <p class="muted">${mod.desc}</p>
        <div class="media">
          <video controls poster="${mod.poster || ''}" style="width:100%;border-radius:8px;">
            <source src="${mod.video}" type="video/mp4">
            Ձեր դիտարկիչը չի աջակցում mp4 ձևաչափը։
          </video>
        </div>
        <div class="module-text">${mod.content || ''}</div>
        <div class="card-actions">
          ${cardActionsPractice}
          ${cardActions}
        </div>
      `;
    }
  }
});


      document.querySelector('.module-list button')?.click();
