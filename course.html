      <h4>Տեղեկատվական անվտանգության հիմնահարցերը</h4>

<p>
Տեղեկությունների հավաքագրման և տարածման արագ զարգացումը հանգեցրել է 
տեղեկատվական–հաղորդակցական նոր ոլորտի ձևավորմանը։ Վերջին 50 տարիների ընթացքում 
տեղեկատվության փոխանցման արագությունը աճել է շուրջ <strong>300000 անգամ</strong>, ինչը 
ցույց է տալիս տվյալ դաշտի աննախադեպ զարգացումը։
</p>

<p>
Արտահայտությունը «անվտանգություն» առօրյա մակարդակում ընկալվում է որպես 
<strong>վտանգի բացակայություն</strong>։ Իսկ «վտանգ» ասելով՝ հասկանում ենք հնարավոր սպառնալիք կամ 
նման իրավիճակ, որը կարող է վնաս հասցնել։
</p>

<h4>Ի՞նչ է տեղեկատվական անվտանգությունը</h4>

<p>
Տեղեկատվական անվտանգությունը տեղեկատվության և նրան սպասարկող ենթակառուցվածքների 
պաշտպանությունն է՝ պատահական կամ կանխամտածված, բնական կամ արհեստական ազդեցություններից, 
որոնք կարող են վնաս հասցնել տեղեկատվական հարաբերությունների սուբյեկտներին։
</p>

<p>
Շատ երկրներում այն դիտարկվում է ընդհանուր անվտանգության կարևոր բաղադրիչ՝ կողքին ունենալով 
համակարգչային անվտանգության, ցանցերի անվտանգության, հեռահաղորդակցության անվտանգության և 
տվյալների պաշտպանության ոլորտները։
</p>

<p>
Ընդհանուր իմաստով, տեղեկատվական անվտանգությունը նշանակում է տեղեկատվության և 
տեղեկատվական համակարգերի պաշտպանություն <strong>չարտոնված մուտքից, օգտագործումից, հրապարակումից, 
փոփոխումից կամ ոչնչացումից</strong>՝ ապահովելով գաղտնիություն, ամբողջականություն և հասանելիություն։
</p>

<h4>Տեղեկատվական անվտանգության հիմնական սկզբունքները</h4>

<ul>
  <li>
    <strong>Գաղտնիություն (Confidentiality)</strong> – Տվյալները հասանելի են միայն լիազորված անձանց։ 
    Կանխվում է չարտոնված մուտքը։
  </li>

  <li>
    <strong>Ամբողջականություն (Integrity)</strong> – Տվյալները պետք է պահպանվեն ճիշտ, չփոփոխված և 
    չխեղաթյուրված։ Պաշտպանում է չարտոնված փոփոխություններից։
  </li>

  <li>
    <strong>Հասանելիություն (Availability)</strong> – Լիազորված օգտատերերը պետք է կարողանան օգտվել 
    տեղեկություններից այն պահին, երբ անհրաժեշտ է։
  </li>

  <li>
    <strong>Հավաստիություն (Authenticity)</strong> – Հաստատում է տեղեկատվության աղբյուրի իսկությունը՝ 
    կանխելով կեղծումը։
  </li>

  <li>
    <strong>Հետևելիություն (Accountability)</strong> – Համակարգում կատարվող գործողությունները պետք է 
    հաշվառվեն, որպեսզի հնարավոր լինի հետևել դրանց և որոշել պատասխանատվությունը։
  </li>

  <li>
    <strong>Չհրաժարում (Non-repudiation)</strong> – Գործողության հեղինակն չի կարող հրաժարվել 
    իր կատարած գործողությունից։ Կարևոր է իրավական գործընթացներում։
  </li>

  <li>
    <strong>Ռիսկի կառավարում (Risk Management)</strong> – Սպառնալիքների ու խոցելիությունների 
    բացահայտում, վերլուծություն և նվազեցում։
  </li>

  <li>
    <strong>Մուտքի կառավարում (Access Control)</strong> – Ով, երբ և ինչ պայմաններում կարող է մուտք 
    ունենալ տվյալ համակարգերին։
  </li>
</ul>

<h4>Տեղեկատվական անվտանգության ուսումնասիրության հիմնական ուղղությունները</h4>

<p>
Տեղեկատվական անվտանգության ուսումնասիրության մեջ առանձնացվում են երկու հիմնական 
մոտեցումներ։
</p>

<p><strong>1. Տեխնիկական ուղղություն</strong> –  
նպատակ ունի պաշտպանել տեղեկատվական ենթակառուցվածքները խափանումներից, 
կիբեռհարձակումներից, տեխնիկական սխալներից և արտաքին ազդեցություններից։  
Կենտրոնանում է համակարգերի անխափան աշխատանքի վրա։
</p>

<p><strong>2. Լայն (հասարակական) ուղղություն</strong> –  
ուսումնասիրում է տեղեկատվական ռեսուրսների դերը 
ազգային անվտանգության, պետական կառավարման, հասարակական կայունության և 
տեղեկատվական միջավայրի պաշտպանության համատեքստում։
</p>

<p>
Այսպիսով, տեղեկատվական անվտանգությունը համարվում է բազմաշերտ ոլորտ՝ բաղկացած ինչպես 
տեխնիկական պաշտպանությունից, այնպես էլ հասարակական, իրավական և կազմակերպչական 
միջոցառումներից։
</p>

    `
