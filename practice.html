<!doctype html>
<html lang="hy">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Գործնական — Տեղեկատվական անվտանգություն</title>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <header class="site-header container">
    <div class="container-logo-block">
      <img src="assets/images/logo.png" alt="">
    </div>
  </header>

  <div class="main-block-course">
    <h2 id="practice-title">Գործնական առաջադրանք</h2>
    <div class="practice-banner-block"></div>
  </div>

  <main class="container content">
    <div id="practice-content" class="card">
      Բեռնում է...
    </div>
  </main>

<script>
  const url = new URLSearchParams(window.location.search);
  const moduleId = url.get("module");
  const practiceId = url.get("practice");

  fetch("assets/practices/modules.json")
    .then(res => res.json())
    .then(modules => {
      const mod = modules.find(m => m.id == moduleId);
      if (!mod) {
        document.getElementById('practice-content').innerHTML = "<p>Մոդուլը չի գտնվել...</p>";
        return;
      }

      const practice = mod.practices.find(p => p.id == practiceId);
      if (!practice) {
        document.getElementById('practice-content').innerHTML = "<p>Առաջադրանքը չի գտնվել...</p>";
        return;
      }

      document.getElementById("practice-title").textContent =
        `${practice.title}`;

      document.getElementById("practice-content").innerHTML = `
        ${practice.content}

        <br/><br/>
        <label>Ձեր արդյունքի նոթ — ֆայլի անվանում
          <textarea id="practiceNote"></textarea>
        </label>

        <button class="btn primary" id="savePractice">Պահպանել արդյունքը</button>
        <div id="practiceMsg" class="muted"></div>
      `;

      document.getElementById("savePractice").onclick = () => {
        const note = document.getElementById("practiceNote").value.trim();
        let saved = JSON.parse(localStorage.getItem("practices") || "[]");

        saved.push({
          module: moduleId,
          practice: practiceId,
          date: new Date().toISOString(),
          note
        });

        localStorage.setItem("practices", JSON.stringify(saved));
        document.getElementById("practiceMsg").textContent = "Արդյունքը պահպանվեց։";
      };
    });
</script>

</body>
</html>
